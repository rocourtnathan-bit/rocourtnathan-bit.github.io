<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Octagon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pixel Octagon: a 3D voxel MMA fighting game with boxing, Muay Thai, karate, BJJ and wrestling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D arena canvas, broadcast-style overlays pinned to the edges, menus as a left-anchored panel over the live octagon. */
:root{
  --ink:#0a0c12;         /* arena dark */
  --panel:#121623;       /* menu panel */
  --panel2:#1a2031;
  --line:#2b3350;
  --mat:#e9e6dc;         /* octagon canvas */
  --dim:#8d96b3;
  --red:#e0313f;         /* red corner */
  --blue:#2f6bff;        /* blue corner */
  --gold:#f3b928;        /* belts, supers */
  --green:#3fd27a;       /* stamina */
  --fire:#ff7a1a;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-name:"Teko", "Arial Narrow", Impact, sans-serif;
  --f-body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--mat);overflow:hidden;font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--ink)}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;z-index:1}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));z-index:1}
button{font-family:var(--f-body);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:5;display:flex;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.screen[hidden]{display:none!important}
.panel{background:linear-gradient(180deg,rgba(18,22,35,.94),rgba(12,15,24,.96));border:2px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:22px;width:min(560px,100%);margin:auto 0;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.wide{width:min(980px,100%);margin:auto}
.panel.left{margin-left:max(0px,4vw)}
h1.logo{font-family:var(--f-display);font-size:clamp(22px,4.4vw,44px);line-height:1.15;margin:0;color:var(--mat);text-shadow:4px 4px 0 var(--red),8px 8px 0 rgba(0,0,0,.6);letter-spacing:1px}
h1.logo span{color:var(--gold)}
.tag{font-family:var(--f-name);font-size:20px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin:0}
h2{font-family:var(--f-name);font-weight:600;font-size:38px;line-height:1;margin:0;letter-spacing:1px;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--f-name);font-weight:500;font-size:24px;margin:0;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
p{margin:0;line-height:1.45}
.muted{color:var(--dim)}
.small{font-size:13px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);color:var(--mat);border:2px solid var(--line);padding:11px 14px;font-family:var(--f-name);font-size:24px;letter-spacing:1.5px;text-transform:uppercase;text-align:left;transition:transform .08s,background .12s,border-color .12s}
.btn small{font-family:var(--f-body);font-size:12px;letter-spacing:.5px;text-transform:none;color:var(--dim)}
.btn:hover,.btn.sel{background:#232b44;border-color:var(--gold);transform:translateX(4px)}
.btn.primary{background:var(--red);border-color:#ff6b75;color:#fff}
.btn.primary:hover{background:#f04450}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px;justify-content:center;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;color:var(--mat)}
button.card:hover,.card.sel{border-color:var(--gold)}
.card.locked{opacity:.5}
.card .nm{font-family:var(--f-name);font-size:26px;line-height:.95;text-transform:uppercase}
.card .nk{color:var(--gold);font-family:var(--f-name);font-size:18px;letter-spacing:1px}
.chip{display:inline-block;font-family:var(--f-name);font-size:16px;letter-spacing:1px;padding:1px 8px;border:1px solid var(--line);text-transform:uppercase;color:var(--dim)}
.chip.red{color:#fff;background:var(--red);border-color:var(--red)}
.chip.gold{color:#1a1200;background:var(--gold);border-color:var(--gold)}
.chip.blue{color:#fff;background:var(--blue);border-color:var(--blue)}
.fcard{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.25);border:2px solid var(--line);padding:10px 12px}
.fcard .lv{font-family:var(--f-display);font-size:12px;color:var(--gold)}
.xpbar{height:8px;background:#0a0c12;border:1px solid var(--line);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#ffe08a)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
input[type=text]{background:#0b0e17;border:2px solid var(--line);color:var(--mat);padding:9px 10px;font-family:var(--f-name);font-size:22px;letter-spacing:1px;width:100%}
input[type=range]{width:100%;accent-color:var(--gold)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border:2px solid var(--line);padding:0}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{background:var(--panel2);border:2px solid var(--line);color:var(--mat);padding:6px 10px;font-family:var(--f-name);font-size:19px;letter-spacing:1px;text-transform:uppercase}
.opt button.sel{border-color:var(--gold);color:var(--gold)}
.stat{display:grid;grid-template-columns:132px 1fr 52px 34px;gap:8px;align-items:center}
.stat .sn{font-family:var(--f-name);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:1px}
.stat .sv{font-family:var(--f-display);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.stat .bar{height:12px;background:#0b0e17;border:1px solid var(--line);position:relative}
.stat .bar i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.stat .bar i.max{background:var(--gold)}
.stat button{height:30px;background:var(--green);color:#03140a;border:0;font-weight:700;font-size:20px}
.stat button[disabled]{background:#2a3146;color:#58607a}
.mvlist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.mvlist b{font-family:var(--f-name);font-weight:500;font-size:19px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.scroll{overflow-y:auto;max-height:min(62vh,640px);padding-right:4px}
.kbd{display:inline-block;font-family:var(--f-display);font-size:10px;padding:4px 6px;border:1px solid var(--dim);border-bottom-width:3px;color:var(--mat);margin-right:4px}
.confirm{border:2px solid var(--red);padding:12px;background:rgba(224,49,63,.12);display:flex;flex-direction:column;gap:10px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:center;overflow-x:auto}
.bcol{display:flex;flex-direction:column;gap:8px;justify-content:space-around;height:100%}
.bm{border:2px solid var(--line);background:var(--panel2);font-family:var(--f-name);font-size:18px;line-height:1;text-transform:uppercase}
.bm div{padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm div+div{border-top:1px solid var(--line)}
.bm .w{color:var(--gold)}
.bm .l{color:#5b6380;text-decoration:line-through}
.bm .you{color:#fff;background:rgba(224,49,63,.35)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none}
#hud[hidden]{display:none}
.top{position:absolute;left:0;right:0;top:0;padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:4px;min-width:0}
.side.r{align-items:flex-end}
.nameplate{display:flex;align-items:baseline;gap:8px;font-family:var(--f-name);text-transform:uppercase;line-height:.9;max-width:100%}
.nameplate .n{font-size:30px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 #000}
.nameplate .s{font-size:17px;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.hp{width:100%;height:24px;background:#1b0b0e;border:2px solid #000;position:relative;transform:skewX(-18deg);box-shadow:3px 3px 0 rgba(0,0,0,.6);overflow:hidden}
.side.r .hp{transform:skewX(18deg)}
.hp i{position:absolute;top:0;bottom:0;left:0;transition:none}
.hp .ghost{background:#fff3;}
.hp .fill{background:linear-gradient(180deg,#ffe15a,#f3a91f 60%,#cc7a00)}
.hp .fill.low{background:linear-gradient(180deg,#ff6b6b,#e0313f 60%,#a1121e)}
.side.r .hp i{left:auto;right:0}
.st{width:80%;height:9px;background:#071a0f;border:2px solid #000;position:relative;transform:skewX(-18deg);overflow:hidden}
.side.r .st{transform:skewX(18deg)}
.st i{position:absolute;top:0;bottom:0;left:0;background:var(--green)}
.side.r .st i{left:auto;right:0}
.meta{display:flex;gap:6px;align-items:center;font-family:var(--f-name);font-size:18px;letter-spacing:1px;text-transform:uppercase}
.sup{display:flex;gap:3px}
.sup b{width:22px;height:9px;background:#151a2a;border:1px solid #000;transform:skewX(-18deg)}
.sup b.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.sup.full b{animation:pulse .5s infinite alternate}
@keyframes pulse{to{background:#fff3c2}}
.streak{color:var(--dim)}
.streak.hot{color:var(--fire);text-shadow:0 0 8px var(--fire)}
.clock{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.65);border:2px solid #000;padding:6px 12px 4px}
.clock .t{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.clock .rd{font-family:var(--f-name);font-size:17px;letter-spacing:2px;color:var(--gold)}
.dots{display:flex;gap:4px;justify-content:center}
.dots i{width:8px;height:8px;border:1px solid var(--gold)}
.dots i.on{background:var(--gold)}
.bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.mv{position:relative;min-width:84px;background:rgba(8,10,16,.82);border:2px solid #000;padding:5px 8px 4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px}
.mv .k{font-family:var(--f-display);font-size:9px;color:var(--gold)}
.mv .l{font-family:var(--f-name);font-size:17px;line-height:1;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.mv .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.mv.off{opacity:.4}
.mv.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(243,185,40,.7)}
#pops{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-name);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:popup 0.9s ease-out forwards}
.pop.dmg{font-family:var(--f-display);font-size:13px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
#banner{position:fixed;left:0;right:0;top:38%;z-index:6;text-align:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(26px,6vw,64px);color:#fff;text-shadow:5px 5px 0 var(--red),10px 10px 0 rgba(0,0,0,.6)}
#banner small{display:block;font-family:var(--f-name);font-size:clamp(20px,3vw,34px);letter-spacing:4px;color:var(--gold);text-shadow:2px 2px 0 #000;margin-top:14px}
#banner.show{animation:ban .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes ban{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center}
#prac{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:120px;z-index:5;display:flex;flex-direction:column;gap:6px;width:200px;background:rgba(10,12,18,.85);border:2px solid var(--line);padding:10px}
#prac[hidden]{display:none}
#prac .opt button{font-size:16px;padding:4px 7px}
.flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#fff;opacity:0}
#touch{position:fixed;inset:auto 0 0 0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#touch[hidden]{display:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;pointer-events:auto}
#touch .acts{display:grid;grid-template-columns:repeat(3,62px);gap:6px;pointer-events:auto}
#touch button{background:rgba(20,24,38,.7);border:2px solid var(--line);color:var(--mat);font-family:var(--f-name);font-size:18px;text-transform:uppercase;touch-action:none}
#touch button.on{background:var(--gold);color:#000}
#loadmsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:var(--ink);font-family:var(--f-display);font-size:14px;color:var(--gold);text-align:center;padding:20px}
@media (max-width:640px){
  .nameplate .n{font-size:22px}.nameplate .s{display:none}
  .clock .t{font-size:15px}
  .mv{min-width:64px}.mv .l{font-size:14px}
  h2{font-size:30px}
  .stat{grid-template-columns:104px 1fr 40px 30px}.stat .sn{font-size:18px}
  .bracket{grid-template-columns:repeat(4,150px)}
}
@media (prefers-reduced-motion:reduce){.pop,#banner.show{animation-duration:.01s}.btn{transition:none}}
</style>
<canvas id="gl"></canvas>
<div class="vign"></div>
<div class="scan"></div>
<div class="flash" id="flash"></div>

<div id="hud" hidden>
  <div class="top">
    <div class="side" id="pL">
      <div class="nameplate"><span class="n" id="nL">Player</span><span class="s" id="sL">Boxing</span></div>

      <div class="nameplate"><span class="s" id="sR">Muay Thai</span><span class="n" id="nR">CPU</span></div>

      <div class="st"><i id="stR"></i></div>

    </div>

</div>
<div id="pops"></div>
<div id="banner"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   PIXEL OCTAGON — core utilities, audio, save data, game data
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const TAU = Math.PI * 2;
const angWrap = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EASE = {
  lin: (t) => t,
  out: (t) => 1 - (1 - t) * (1 - t) * (1 - t),
  in: (t) => t * t * t,
  io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  snap: (t) => 1 - Math.pow(1 - t, 5),
};

/* ---------------- Audio (all synthesized, no files) ---------------- */
const Sound = {
  ctx: null, master: null, crowdGain: null, vol: 0.7, noiseBuf: null, fx: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.vol;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.startCrowd();
    } catch (e) { this.ctx = null; }
  },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  noise({ dur = 0.2, type = 'lowpass', f = 1000, f2 = null, q = 1, g = 0.5, a = 0.002, delay = 0 }) {
    if (!this.ctx) return;
    const t = this.now() + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = rand(0.8, 1.2);
    const fl = this.ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = this.ctx.createGain(); gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(g, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(gn); gn.connect(this.master);
    src.start(t, Math.random()); src.stop(t + dur + 0.05);
  },
  tone({ f = 100, f2 = null, dur = 0.2, g = 0.5, type = 'sine', delay = 0 }) {
    if (!this.ctx) return;
    const t = this.now() + delay;
    const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = this.ctx.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  hit(power = 1, head = true) {
    if (!this.fx) return;
    const p = clamp(power, 0.3, 2);
    this.tone({ f: head ? 140 : 95, f2: 40, dur: 0.12 + 0.08 * p, g: 0.55 * p });
    this.noise({ dur: 0.07 + 0.05 * p, type: 'lowpass', f: head ? 2600 : 1400, f2: 300, g: 0.6 * p });
    if (p > 1.1) this.noise({ dur: 0.25, type: 'bandpass', f: 180, q: 0.7, g: 0.5, delay: 0.01 });
  },
  block() { if (!this.fx) return; this.noise({ dur: 0.08, type: 'bandpass', f: 900, q: 2, g: 0.45 }); this.tone({ f: 220, f2: 120, dur: 0.06, g: 0.25 }); },
  parry() { if (!this.fx) return; this.tone({ f: 1400, f2: 700, dur: 0.18, g: 0.25, type: 'triangle' }); this.noise({ dur: 0.1, type: 'highpass', f: 3000, g: 0.25 }); },
  whoosh(p = 1) { if (!this.fx) return; this.noise({ dur: 0.16 + 0.08 * p, type: 'bandpass', f: 500, f2: 2200, q: 1.5, g: 0.18 * p }); },
  slam() { if (!this.fx) return; this.tone({ f: 80, f2: 30, dur: 0.45, g: 0.9 }); this.noise({ dur: 0.35, type: 'lowpass', f: 900, f2: 100, g: 0.8 }); },
  bell(n = 1) { for (let i = 0; i < n; i++) { const d = i * 0.32; this.tone({ f: 1046, dur: 1.2, g: 0.25, type: 'sine', delay: d }); this.tone({ f: 1568, dur: 0.8, g: 0.12, delay: d }); this.tone({ f: 2637, dur: 0.4, g: 0.06, delay: d }); } },
  ui() { this.tone({ f: 660, f2: 880, dur: 0.06, g: 0.12, type: 'square' }); },
  power() { if (!this.fx && Game.mode === 'fight') return; this.tone({ f: 220, f2: 880, dur: 0.5, g: 0.2, type: 'sawtooth' }); this.noise({ dur: 0.5, type: 'bandpass', f: 400, f2: 3000, g: 0.25 }); },
  levelUp() { [523, 659, 784, 1046].forEach((f, i) => this.tone({ f, dur: 0.25, g: 0.18, type: 'square', delay: i * 0.09 })); },
  startCrowd() {
    if (!this.ctx) return;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 0.6;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    this.crowdGain = this.ctx.createGain(); this.crowdGain.gain.value = 0.03;
    src.connect(bp); bp.connect(lp); lp.connect(this.crowdGain); this.crowdGain.connect(this.master); src.start();
  },
  crowd(level) { if (this.crowdGain) this.crowdGain.gain.setTargetAtTime(level, this.now(), 0.25); },
  cheer(amount = 1) {
    if (!this.crowdGain || !this.fx) return;
    const g = this.crowdGain.gain, t = this.now();
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.05 + 0.12 * amount, t + 0.15); g.setTargetAtTime(0.045, t + 0.5, 0.8);
  },
};

/* ---------------- Save system ---------------- */
const SAVE_KEY = 'pixelOctagon.save.v1';
const DEFAULT_SETTINGS = { pixel: 3, vol: 0.7, round: 30, shake: true, dmgNums: true, v: 2 };
let SAVE = { fighters: [], active: null, settings: { ...DEFAULT_SETTINGS } };
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.fighters)) {
        const old = s.settings || {};
        SAVE = { ...SAVE, ...s, settings: { ...DEFAULT_SETTINGS, ...old } };
        if (old.v !== 2) { SAVE.settings.round = 30; SAVE.settings.v = 2; } // new 30s default
      }
    }
  } catch (e) { /* storage blocked: play without saving */ }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* ignore */ } }

function derived(st, extra = {}) {
  const r = (k) => st[k] || 1;
  return {
    dmg: 0.7 + 0.04 * r('str'),
    rate: 0.86 + 0.0125 * r('spd'),
    move: 1.9 + 0.05 * r('spd'),
    cdMul: 1.05 - 0.012 * r('spd'),
    parryWin: 0.13 + 0.008 * r('iq'),
    counterMul: 1 + 0.025 * r('iq'),
    maxStam: 70 + 4 * r('sta'),
    regen: 9 + 0.7 * r('sta'),
    comboMul: 1.12 + 0.012 * r('skl'),
    meterMul: 0.8 + 0.03 * r('skl'),
    reach: 0.004 * r('skl'),
    maxHp: 150 + 6 * r('men'),
    stunMul: 1 - 0.015 * r('men'),
    powerDur: 6 + 0.25 * r('men'),
    ...extra,
  };
}

const Tourney = {

      const a = r[i], b = r[i + 1];
      if (a === 'P' || b === 'P') next.push(won ? 'P' : (a === 'P' ? b : a));

      <button data-k="KeyO">Ctr</button><button data-k="TouchSuper">Sup</button><button data-k="TouchDodge">Dodge</button><button data-k="KeyF">Fin</button></div>`;
    T.querySelectorAll('button').forEach((b) => {
      const k = b.dataset.k;
      const down = (e) => { e.preventDefault(); b.classList.add('on'); keyDown(k, false); };
      const up = (e) => { e.preventDefault(); b.classList.remove('on'); keyUp(k); };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    });
  },
  results(d) { UI.lastResult = d; UI.hud(false); UI.banner(''); UI.go('results', d); },
};

const Ref = {
  rig: null, pos: new THREE.Vector2(0, 3.2), yaw: 0, P: null, anim: null, ph: 0,
  init() {
    this.rig = new Rig({ skin: 1, hair: 'short', hairCol: 6, beard: 'none', top: 'none', shorts: 2, gloves: 2, build: 'athletic', height: 'average' }, 'boxing', { ref: true });
    Game.scene.add(this.rig.root); this.P = Float32Array.from(STANCE_POSE.ref);
  },
  wave() { this.anim = { a: getAnim('refWave', 'ref'), t: 0, start: Float32Array.from(this.P) }; },
  reset() { this.anim = null; },
  update(dt) {
    const F = Game.fighters; if (!this.rig) return;
    this.rig.root.visible = F.length === 2 && F[0].rig.root.visible;
    if (F.length < 2) return;
    const a = F[0].pos, b = F[1].pos;
    const mid = new THREE.Vector2((a.x + b.x) / 2, (a.y + b.y) / 2);
    let want;
    const M = Game.match;
    if (M && M.over && M.result) { const L = M.result.loser.pos; want = new THREE.Vector2(L.x, L.y).lerp(mid, -0.6); if (!this.anim && M.phaseT > 0.4) this.wave(); }
    else {
      const ax = new THREE.Vector2(b.x - a.x, b.y - a.y).normalize();
      let perp = new THREE.Vector2(-ax.y, ax.x);

    const look = mid.clone().sub(this.pos);
    const wantYaw = Math.atan2(look.x, look.y);
    this.yaw += clamp(angWrap(wantYaw - this.yaw), -4 * dt, 4 * dt);
    const T = STANCE_POSE.ref;
    if (this.anim) { this.anim.t += dt; sampleAnim(this.anim.a, Math.min(this.anim.t, this.anim.a.dur), this.anim.start, this.P); }
    else {
      const k = 1 - Math.exp(-dt * 8);

  },
};

const KEYS = {};
const lastTap = {};
let dashReq = null, dodgeReq = false, spaceAt = 0;
const ATTACK_KEYS = { KeyJ: 'light', KeyZ: 'light', KeyK: 'medium', KeyX: 'medium', KeyL: 'heavy', KeyC: 'heavy', KeyO: 'counter', KeyV: 'counter', KeyU: 'super', KeyF: 'finisher', KeyB: 'finisher' };

function keyDown(code, repeat) {
  Sound.init();
  const was = KEYS[code]; KEYS[code] = true;
  if (repeat || was) return;
  const M = Game.match;
  if (Game.mode !== 'fight' || !M) return;
  if (code === 'Escape' || code === 'KeyP') { if (!M.over) togglePause(!Game.paused); return; }
  if (Game.paused || M.over) return;
  if (code === 'Space') { dodgeReq = true; return; }
  if (code === 'TouchDodge') { dodgeReq = true; return; }
  if (code === 'TouchSuper') { M.P.queued = { slot: 'super', t: Game.time }; return; }
  const slot = ATTACK_KEYS[code];
  if (slot) M.P.queued = { slot, t: Game.time };
  if (['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight'].includes(code)) {
    const now = performance.now();
    if (lastTap[code] && now - lastTap[code] < 260) dashReq = code;
    lastTap[code] = now;
  }
}
function keyUp(code) { KEYS[code] = false; }
addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT')) return;
  if (Game.mode === 'fight' && !Game.paused && GAME_KEYS.has(e.code)) e.preventDefault();
  keyDown(e.code, e.repeat);
});
addEventListener('keyup', (e) => keyUp(e.code));
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
const _cf = new THREE.Vector3();
function playerIntent(P) {
  const I = P.intent;
  Game.camera.getWorldDirection(_cf);
  const fl = new THREE.Vector2(_cf.x, _cf.z).normalize();
  const right = new THREE.Vector2(-fl.y, fl.x);
  const h = (KEYS.KeyD || KEYS.ArrowRight ? 1 : 0) - (KEYS.KeyA || KEYS.ArrowLeft ? 1 : 0);
  const v = (KEYS.KeyW || KEYS.ArrowUp ? 1 : 0) - (KEYS.KeyS || KEYS.ArrowDown ? 1 : 0);
  const want = new THREE.Vector2(right.x * h + fl.x * v, right.y * h + fl.y * v);
  if (want.lengthSq() > 1) want.normalize();
  const f = P.dirTo(), s = new THREE.Vector2(-f.y, f.x);
  I.fwd = want.dot(f); I.side = want.dot(s);

  if (dodgeReq) { dodgeReq = false; I.dodge = want.lengthSq() > 0.01 ? want.clone() : new THREE.Vector2(); }
  if (dashReq) {
    const dir = dashReq === 'KeyD' || dashReq === 'ArrowRight' ? 1 : -1;
    I.dash = Math.sign(right.dot(f) * dir) || dir; dashReq = null;
  }
}

/* ---------------- physics helpers ---------------- */
function separate() {
  const F = Game.fighters; if (F.length < 2) return;
  const [a, b] = F;
  const g = a.grapple ? a : b.grapple ? b : null;
  if (g) {
    const v = g.grapple.victim, tmp = v.pos.clone(); clampToOctagon(tmp);
    const cx = tmp.x - v.pos.x, cz = tmp.y - v.pos.y;
    v.pos.x += cx; v.pos.y += cz; g.pos.x += cx; g.pos.y += cz; clampToOctagon(g.pos);
    return;
  }
  const lying = (f) => ['down', 'ko', 'getup'].includes(f.state);
  const minD = lying(a) || lying(b) ? 0.42 : 0.6;
  const dx = b.pos.x - a.pos.x, dz = b.pos.y - a.pos.y; const d = Math.hypot(dx, dz);
  if (d < minD) {

    a.pos.x -= nx * push; a.pos.y -= nz * push; b.pos.x += nx * push; b.pos.y += nz * push;

}

/* ---------------- render loop ---------------- */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const real = Math.min(0.05, Math.max(0.0001, (now - last) / 1000)); last = now;
  if (Game.manual) return;
  tick(real, true);
}
function tick(real, render) {
  Game.time += real;
  let dt = real;
  if (Game.paused) dt = 0;
  else if (Game.stopT > 0) { Game.stopT -= real; dt = 0; }
  else if (Game.slowT > 0) { Game.slowT -= real; dt *= Game.slowScale; }
  const M = Game.match;
  if (Game.mode === 'fight' && M) {
    let live = false;
    if (!Game.paused) live = M.update(dt, real);
    const P = M.P;
    if (live && !Game.paused) { playerIntent(P); Game.ais.forEach((ai) => ai && ai.update(dt)); }
    else if (!Game.paused) { P.intent.fwd = 0; P.intent.side = 0; P.intent.block = false; P.queued = null; M.C.intent.attack = null; }
  } else if (Game.exhibition) Game.ais.forEach((ai) => ai && ai.update(dt));
  if (dt > 0) for (const f of Game.fighters) f.update(dt);
  separate();
  for (const f of Game.fighters) f.pose(dt || 1e-4);
  for (const f of Game.fighters) {
    if (!f.rig.root.visible) continue;
    if (f.powered) FX.aura(f, dt, '#ff7a1a', 70);
    else if (f.evolved && Game.mode === 'fight') FX.aura(f, dt, '#f3b928', 5);
  }
  Preview.update(real);
  Ref.update(dt);
  FX.update(dt);
  Arena.update(real, Game.time);
  Cam.update(real);

function onResize() {

  const px = SAVE.settings.pixel || 3;
  const eff = px === 1 ? 1 : clamp(px * Math.min(1, h / 900), 1.5, px);
  r.setPixelRatio(px === 1 ? Math.min(devicePixelRatio || 1, 2) : 1);

function boot() {

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 140);
  Object.assign(Game, { renderer, scene, camera });

  UI.init(); onResize(); addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.mode === 'fight' && Game.match && !Game.match.over && !Game.paused) togglePause(true); });
  $('#loadmsg').remove();
  UI.go('title');
  requestAnimationFrame(loop);
  window.__PO = { Game, UI, SAVE: () => SAVE, ACT, startFight, MOVES, STYLES, KEYS, keyDown, keyUp,
    step(n, dt = 1 / 60, render = true) { Game.manual = true; for (let i = 0; i < n; i++) tick(dt, render && i === n - 1); },
    auto() { Game.manual = false; } };
}
boot();
