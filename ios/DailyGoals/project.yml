name: DailyGoals
options:
  bundleIdPrefix: com.nathan
  deploymentTarget:
    iOS: "17.0"
targets:
  DailyGoals:
    type: application
    platform: iOS
    sources: [DailyGoals]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathan.dailygoals
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daily Goals
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
